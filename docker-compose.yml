services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-product_memory}
      POSTGRES_USER: ${POSTGRES_USER:-product_memory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-product_memory_local_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-product_memory} -d ${POSTGRES_DB:-product_memory}"]
      interval: 3s
      timeout: 3s
      retries: 30

  product-memory:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-product_memory}:\
        ${POSTGRES_PASSWORD:-product_memory_local_only}@db:5432/\
        ${POSTGRES_DB:-product_memory}"
    depends_on:
      db:
        condition: service_healthy
    # Ollama runs on the host, not here: Docker on macOS has no access to the GPU, so a
    # containerised model would fall back to the CPU and answer at a crawl.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "${HOST_KNOWLEDGE_DIR:-./knowledge}:/knowledge:ro"
      - "./eval:/eval:ro"
      - huggingface_cache:/models/huggingface
    ports:
      - "127.0.0.1:${MCP_PORT:-2600}:8080"
    command:
      - uvicorn
      - product_memory.mcp_server:app
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --workers
      - "1"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8080/health/live', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.3
    restart: unless-stopped
    environment:
      # The only model it may reach is this service's grounded endpoint, on the compose network.
      # Ollama is deliberately not exposed to it: a raw model with no sources attached looks
      # identical in the UI and answers from its training instead of from your documents.
      ENABLE_OLLAMA_API: "false"
      OPENAI_API_BASE_URLS: "http://product-memory:8080/v1"
      OPENAI_API_KEYS: "${CHAT_API_KEY:-product-memory-local-only}"
      WEBUI_SECRET_KEY: "${WEBUI_SECRET_KEY:-product-memory-local-only}"
      # Single user on loopback. Turn this on and remove the port binding's 127.0.0.1 if it ever
      # needs to serve more than the person sitting at the machine.
      WEBUI_AUTH: "false"
      ENABLE_SIGNUP: "false"
      # Everything below keeps the container from reaching the internet. Its own RAG stack would
      # otherwise download embedding models and duplicate the index this service already holds.
      RAG_EMBEDDING_ENGINE: ""
      AUDIO_STT_ENGINE: ""
      ENABLE_WEB_SEARCH: "false"
      ENABLE_IMAGE_GENERATION: "false"
      ENABLE_VERSION_UPDATE_CHECK: "false"
      HF_HUB_OFFLINE: "1"
      ANONYMIZED_TELEMETRY: "false"
      DO_NOT_TRACK: "true"
      SCARF_NO_ANALYTICS: "true"
    volumes:
      - open_webui_data:/app/backend/data
    ports:
      - "127.0.0.1:${OPEN_WEBUI_PORT:-2605}:8080"
    depends_on:
      product-memory:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-2602}:9090"

  loki:
    image: grafana/loki:3.3.2
    profiles: ["observability"]
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./observability/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:${LOKI_PORT:-2603}:3100"

  promtail:
    image: grafana/promtail:3.3.2
    profiles: ["observability"]
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml -config.expand-env=true
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-tpo-agentic-automation-document-memory-rag}
    volumes:
      - ./observability/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      # Read-only socket access is enough to discover containers and read their logs.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_data:/tmp
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.5.1
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      POSTGRES_USER: ${POSTGRES_USER:-product_memory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-product_memory_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-product_memory}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-2601}:3000"
    depends_on:
      - prometheus
      - loki

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    profiles: ["observability"]
    restart: unless-stopped
    # SQLite rather than the Postgres next door: the official image ships no psycopg2, and
    # installing one at startup would put a network call in the boot path.
    command:
      - mlflow
      - server
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --artifacts-destination
      - /mlflow/artifacts
      - --serve-artifacts
      - --host
      - 0.0.0.0
      - --port
      - "5000"
    volumes:
      - mlflow_data:/mlflow
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-2604}:5000"

volumes:
  postgres_data:
    name: ${COMPOSE_PROJECT_NAME:-tpo-agentic-automation-document-memory-rag}_postgres_data
  huggingface_cache:
    name: ${COMPOSE_PROJECT_NAME:-tpo-agentic-automation-document-memory-rag}_huggingface_cache
  open_webui_data:
    name: ${COMPOSE_PROJECT_NAME:-tpo-agentic-automation-document-memory-rag}_open_webui_data
  prometheus_data:
  loki_data:
  promtail_data:
  grafana_data:
  mlflow_data:
