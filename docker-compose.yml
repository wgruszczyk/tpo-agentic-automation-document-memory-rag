services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-product_memory}
      POSTGRES_USER: ${POSTGRES_USER:-product_memory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-product_memory_local_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-product_memory} -d ${POSTGRES_DB:-product_memory}"]
      interval: 3s
      timeout: 3s
      retries: 30

  product-memory:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-product_memory}:\
        ${POSTGRES_PASSWORD:-product_memory_local_only}@db:5432/\
        ${POSTGRES_DB:-product_memory}"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - "${HOST_KNOWLEDGE_DIR:-./knowledge}:/knowledge:ro"
      - huggingface_cache:/models/huggingface
    ports:
      - "127.0.0.1:${MCP_PORT:-2600}:8080"
    command:
      - uvicorn
      - product_memory.mcp_server:app
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --workers
      - "1"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
  huggingface_cache:
